<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Live Sync Broadcast Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #player-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .media-element {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
    }

    /* Top-Left Status Box (Always visible, sleek pill style) */
#debug-status {
  position: absolute;
  top: max(5px, env(safe-area-inset-top));
  left: max(14px, env(safe-area-inset-left));
  color: rgba(255, 255, 255, 0.9);
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 7px;
  font-weight: 500;
  letter-spacing: 0.3px;
  padding: 4px 10px;

  z-index: 10000;
  pointer-events: none;
  max-width: 60vw;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

    /* Broadcast TV Bug Logo (Top-Right Transparent Overlay) */
    #tv-logo-overlay {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 0.4rem;
      z-index: 10000;
      pointer-events: none;
      opacity: 0.55;
      background: rgba(20, 20, 20, 0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 4px 9px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transform-origin: top right;
    }

    .logo-icon {
      width: clamp(16px, 2vw, 20px);
      height: clamp(16px, 2vw, 20px);
      background: linear-gradient(135deg, rgba(255, 59, 48, 0.85), rgba(255, 149, 0, 0.85));
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-icon svg {
      width: 65%;
      height: 65%;
      fill: #ffffff;
    }

    .logo-text-container {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    .logo-title {
      font-size: clamp(9px, 1.1vw, 12px);
      font-weight: 700;
      letter-spacing: 0.4px;
      color: rgba(255, 255, 255, 0.9);
      text-transform: uppercase;
    }

    .logo-subtitle {
      font-size: clamp(6px, 0.7vw, 8px);
      font-weight: 500;
      letter-spacing: 0.6px;
      color: rgba(255, 215, 0, 0.85);
      text-transform: uppercase;
      margin-top: 1px;
    }

    /* Loading Overlay & Spinner */
    #loader-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 9998;
      pointer-events: none;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .spinner {
      width: 54px;
      height: 54px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ff3b30;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .loading-text {
      color: #ffd700;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Bottom Control Overlay */
    #controls-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 0 16px calc(16px + env(safe-area-inset-bottom)) 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .ui-hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Sleek Round Icon Buttons */
    .control-btn {
      background: rgba(25, 25, 25, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.85);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s, transform 0.1s;
    }

    .control-btn svg {
      width: 17px;
      height: 17px;
      fill: rgba(255, 255, 255, 0.9);
    }

    .control-btn:active {
      transform: scale(0.9);
      background: rgba(50, 50, 50, 0.75);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <div id="player-container">
    <!-- Top-Left Status Display (always visible) -->
    <div id="debug-status">Now Playing : Initializing...</div>

    <!-- Top-Right Transparent TV Watermark Overlay -->
    <div id="tv-logo-overlay">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
      </div>
      <div class="logo-text-container">
        <span class="logo-title">APNA TV</span>
        <span class="logo-subtitle">Ghar Jaisa</span>
      </div>
    </div>

    <!-- Centered Loader Spinner -->
    <div id="loader-overlay">
      <div class="spinner"></div>
      <div class="loading-text">Please Wait</div>
    </div>

    <!-- Media Elements -->
    <video id="native-player" class="media-element" autoplay muted playsinline webkit-playsinline></video>
    <iframe id="iframe-player" class="media-element" style="display: none;"></iframe>

    <!-- Bottom Controls -->
    <div id="controls-overlay">
      <div class="controls-left">
        <button id="btn-play" class="control-btn" aria-label="Play/Pause">
          <svg id="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          <svg id="icon-play" viewBox="0 0 24 24" style="display:none;"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button id="btn-mute" class="control-btn" aria-label="Mute/Unmute">
          <svg id="icon-muted" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          <svg id="icon-unmuted" viewBox="0 0 24 24" style="display:none;"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
      </div>

      <div class="controls-right">
        <button id="btn-fullscreen" class="control-btn" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>
    </div>
  </div>     
      <script>
    const PLAYLIST_URL = './playlist.json';
    const FALLBACK_VIDEO_URL = './fallback.mp4';
    const FETCH_INTERVAL_MS = 2000;
    const SYNC_CHECK_INTERVAL_MS = 500;
    const MAX_ALLOWED_DRIFT_SEC = 0.5;
    const UI_HIDE_TIMEOUT_MS = 3000;
    const BUFFER_RECOVERY_TIMEOUT_MS = 3000; // 3-second buffer tolerance before fallback

    const container = document.getElementById('player-container');
    const videoElem = document.getElementById('native-player');
    const iframeElem = document.getElementById('iframe-player');
    const debugElem = document.getElementById('debug-status');
    const loaderElem = document.getElementById('loader-overlay');
    const controlsOverlay = document.getElementById('controls-overlay');

    const btnPlay = document.getElementById('btn-play');
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');

    const btnMute = document.getElementById('btn-mute');
    const iconMuted = document.getElementById('icon-muted');
    const iconUnmuted = document.getElementById('icon-unmuted');

    const btnFullscreen = document.getElementById('btn-fullscreen');

    let playlist = [];
    let hlsInstance = null;
    let currentItem = null;
    let currentItemStartTime = null;
    let totalPlaylistDuration = 0;
    let uiHideTimer = null;
    
    let isFallbackActive = false;
    let bufferTimeoutTimer = null;
    let consecutiveFetchFailures = 0;

    videoElem.muted = true;

    function hideLoader() {
      loaderElem.classList.add('ui-hidden');
    }
    function showLoader() {
      loaderElem.classList.remove('ui-hidden');
    }

    videoElem.addEventListener('playing', () => {
      clearBufferTimeout();
      hideLoader();
    });
    videoElem.addEventListener('waiting', showLoader);
    videoElem.addEventListener('seeking', showLoader);
    videoElem.addEventListener('seeked', () => {
      if (!videoElem.paused) hideLoader();
    });

    iframeElem.addEventListener('load', hideLoader);

    // --- Buffer & Network Failure Tolerances ---
    function clearBufferTimeout() {
      if (bufferTimeoutTimer) {
        clearTimeout(bufferTimeoutTimer);
        bufferTimeoutTimer = null;
      }
    }

    function scheduleFallbackIfUnrecovered(reasonMessage) {
      if (isFallbackActive || bufferTimeoutTimer || document.hidden) return;
      
      // Wait for buffer tolerance window to allow natural network recovery
      bufferTimeoutTimer = setTimeout(() => {
        triggerFallback(reasonMessage);
      }, BUFFER_RECOVERY_TIMEOUT_MS);
    }

    // --- Fallback Mechanism ---
    function triggerFallback(reasonMessage) {
      if (isFallbackActive) return;
      clearBufferTimeout();
      isFallbackActive = true;

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      iframeElem.style.display = 'none';
      iframeElem.src = '';

      videoElem.style.display = 'block';
      videoElem.loop = true;

      const fullFallbackPath = new URL(FALLBACK_VIDEO_URL, window.location.href).href;
      if (videoElem.src !== fullFallbackPath) {
        videoElem.src = FALLBACK_VIDEO_URL;
      }

      videoElem.play().catch(() => {});
      hideLoader();
      debugElem.textContent = reasonMessage ? `Now Playing : ${reasonMessage}` : `Now Playing : Fallback Stream`;
    }

    // Native Media Error & Stalled Hooks (Tolerant to Small Dips)
    videoElem.addEventListener('error', () => {
      scheduleFallbackIfUnrecovered('Playback Error');
    });

    videoElem.addEventListener('stalled', () => {
      scheduleFallbackIfUnrecovered('Stream Stalled');
    });

    // --- Page Visibility Listener (Prevents Background Tab Fallback) ---
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        // Tab is active again: Clear false flags and resync instantly
        clearBufferTimeout();
        consecutiveFetchFailures = 0;
        if (playlist.length > 0) {
          syncEngine();
        } else {
          fetchPlaylist();
        }
      }
    });

    // --- 1. Fetching Logic (With Failure Thresholds) ---
    async function fetchPlaylist() {
      // Don't flag errors if tab is running throttled in background
      if (document.hidden) return;

      try {
        const response = await fetch(`${PLAYLIST_URL}?cachebuster=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) {
          consecutiveFetchFailures++;
          if (consecutiveFetchFailures >= 3) {
            triggerFallback(`Playlist Fetch Error (HTTP ${response.status})`);
          }
          return;
        }
        
        const data = await response.json();
        consecutiveFetchFailures = 0; // Reset network error counter
        
        if (Array.isArray(data) && data.length > 0) {
          if (JSON.stringify(data) !== JSON.stringify(playlist)) {
            const newTotalDuration = data.reduce((acc, item) => acc + (item.duration_seconds || 0), 0);

            if (!currentItem) {
              playlist = data;
              totalPlaylistDuration = newTotalDuration;
              syncEngine();
            } else {
              playlist = data;
              totalPlaylistDuration = newTotalDuration;
              console.log("Playlist updated in background safely.");
            }
          }
        } else {
          triggerFallback('Empty Playlist');
        }
      } catch (e) {
        consecutiveFetchFailures++;
        if (consecutiveFetchFailures >= 3) {
          triggerFallback('Playlist Network Error');
        }
      }
    }
    setInterval(fetchPlaylist, FETCH_INTERVAL_MS);
    fetchPlaylist();

    // --- 2. Anchor-Aware Live Broadcast Time Logic ---
    function getGlobalTimeState() {
      if (!totalPlaylistDuration || totalPlaylistDuration === 0) return null;
      
      const epochSeconds = Date.now() / 1000;

      if (currentItem && currentItemStartTime !== null) {
        const elapsed = epochSeconds - currentItemStartTime;
        const currentDuration = currentItem.duration_seconds || 0;

        if (elapsed < currentDuration) {
          let idx = playlist.findIndex(i => i.url === currentItem.url);
          return {
            itemIndex: idx >= 0 ? idx : 0,
            item: currentItem,
            seekPosition: Math.max(0, elapsed)
          };
        }
      }

      const currentLoopTime = epochSeconds % totalPlaylistDuration;

      let accumulatedTime = 0;
      for (let i = 0; i < playlist.length; i++) {
        const item = playlist[i];
        const itemDuration = item.duration_seconds || 0;
        if (currentLoopTime >= accumulatedTime && currentLoopTime < accumulatedTime + itemDuration) {
          return {
            itemIndex: i,
            item: item,
            seekPosition: currentLoopTime - accumulatedTime,
            calculatedStartTime: epochSeconds - (currentLoopTime - accumulatedTime)
          };
        }
        accumulatedTime += itemDuration;
      }
      
      return {
        itemIndex: 0,
        item: playlist[0],
        seekPosition: 0,
        calculatedStartTime: epochSeconds
      };
    }

    // --- 3. Strict Live Drift Lock & Sync Engine ---
    function syncEngine() {
      // Pause sync updates if tab is invisible to save performance
      if (document.hidden) return;

      const state = getGlobalTimeState();
      if (!state) {
        if (playlist.length === 0) triggerFallback('No Items Available');
        return;
      }

      const { item, seekPosition } = state;

      // Exit fallback mode as soon as feed is restored
      if (isFallbackActive) {
        isFallbackActive = false;
        videoElem.loop = false;
        currentItem = null; 
      }

      const displayName = item.name ? item.name : `Video ${state.itemIndex + 1}`;
      debugElem.textContent = `Now Playing : ${displayName}`;

      if (!currentItem) {
        currentItem = item;
        currentItemStartTime = state.calculatedStartTime || (Date.now() / 1000 - seekPosition);
        showLoader();
        loadMediaSource(item, seekPosition);
        return;
      }

      if (currentItem.url !== item.url) {
        currentItem = item;
        currentItemStartTime = state.calculatedStartTime || (Date.now() / 1000 - seekPosition);
        showLoader();
        loadMediaSource(item, seekPosition);
        return;
      }

      if (item.type === 'mp4' || item.type === 'm3u8') {
        const drift = Math.abs(videoElem.currentTime - seekPosition);
        if (drift > MAX_ALLOWED_DRIFT_SEC) {
          videoElem.currentTime = seekPosition;
        }

        if (videoElem.paused && iconPlay.style.display === 'none') {
          videoElem.play().catch(() => {});
        }
      }
    }
    setInterval(syncEngine, SYNC_CHECK_INTERVAL_MS);

    // --- 4. Switch Media Types (MP4, HLS, iFrame) ---
    function loadMediaSource(item, initialSeek) {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      videoElem.loop = false;

      if (item.type === 'iframe') {
        videoElem.style.display = 'none';
        videoElem.pause();
        iframeElem.style.display = 'block';
        if (iframeElem.src !== item.url) {
          iframeElem.src = item.url;
        }
      } else {
        iframeElem.style.display = 'none';
        iframeElem.src = '';
        videoElem.style.display = 'block';

        if (item.type === 'm3u8') {
          if (Hls.isSupported()) {
            hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });

            hlsInstance.on(Hls.Events.ERROR, (event, data) => {
              if (data.fatal) {
                switch (data.type) {
                  case Hls.ErrorTypes.NETWORK_ERROR:
                    // Attempt soft recovery first before forcing fallback
                    hlsInstance.startLoad();
                    scheduleFallbackIfUnrecovered(`Stream Network Error`);
                    break;
                  case Hls.ErrorTypes.MEDIA_ERROR:
                    hlsInstance.recoverMediaError();
                    scheduleFallbackIfUnrecovered(`Stream Media Error`);
                    break;
                  default:
                    triggerFallback(`Fatal Stream Error (${data.type})`);
                    break;
                }
              }
            });

            hlsInstance.loadSource(item.url);
            hlsInstance.attachMedia(videoElem);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
              videoElem.currentTime = initialSeek;
              videoElem.play().catch(() => {});
            });
          } else if (videoElem.canPlayType('application/vnd.apple.mpegurl')) {
            videoElem.src = item.url;
            videoElem.currentTime = initialSeek;
            videoElem.play().catch(() => {});
          }
        } else if (item.type === 'mp4') {
          if (videoElem.src !== item.url) {
            videoElem.src = item.url;
          }
          videoElem.currentTime = initialSeek;
          videoElem.play().catch(() => {});
        }
      }
    }

    // --- 5. Auto Fade Control Overlay ---
    function showControls() {
      controlsOverlay.classList.remove('ui-hidden');
      
      clearTimeout(uiHideTimer);
      uiHideTimer = setTimeout(() => {
        controlsOverlay.classList.add('ui-hidden');
      }, UI_HIDE_TIMEOUT_MS);
    }

    container.addEventListener('mousemove', showControls);
    container.addEventListener('click', showControls);
    container.addEventListener('touchstart', showControls, { passive: true });
    container.addEventListener('pointerdown', showControls, { passive: true });
    container.addEventListener('pointermove', showControls, { passive: true });
    document.addEventListener('mousemove', showControls);
    document.addEventListener('pointerdown', showControls, { passive: true });
    showControls();

    // Button Click Handlers
    btnPlay.addEventListener('click', (e) => {
      e.stopPropagation();
      if (videoElem.paused) {
        videoElem.play();
        iconPlay.style.display = 'none';
        iconPause.style.display = 'block';
      } else {
        videoElem.pause();
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
      }
    });

    btnMute.addEventListener('click', (e) => {
      e.stopPropagation();
      videoElem.muted = !videoElem.muted;
      if (videoElem.muted) {
        iconMuted.style.display = 'block';
        iconUnmuted.style.display = 'none';
      } else {
        iconMuted.style.display = 'none';
        iconUnmuted.style.display = 'block';
      }
    });

    btnFullscreen.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        } else if (videoElem.webkitEnterFullscreen) {
          videoElem.webkitEnterFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    });

    // Anti-Bypass Seeking Revert Logic
    videoElem.addEventListener('seeking', () => {
      if (isFallbackActive) return;
      const state = getGlobalTimeState();
      if (state && (state.item.type === 'mp4' || state.item.type === 'm3u8')) {
        const drift = Math.abs(videoElem.currentTime - state.seekPosition);
        if (drift > MAX_ALLOWED_DRIFT_SEC) {
          videoElem.currentTime = state.seekPosition;
        }
      }
    });
      </script>
</body>
</html>

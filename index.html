<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Live Sync Player</title>
<style>
  :root{
    --bg:#000;
    --control-bg: rgba(10,10,12,0.55);
    --control-bg-hover: rgba(20,20,24,0.75);
    --accent:#ff2d55;
    --icon:#fff;
    --live-dot:#ff2d55;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  #player-container{
    position:fixed;
    top:0; left:0;
    width:100%;
    height:100vh;
    height:100svh;
    height:100dvh;
    background:#000;
    overflow:hidden;
    touch-action:none;
  }
  .media-layer{
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:#000;
    opacity:0;
    transition:opacity .35s ease;
    pointer-events:none;
  }
  .media-layer.active{ opacity:1; pointer-events:auto; }
  video.live-video{
    width:100%; height:100%;
    object-fit:contain;
    background:#000;
    outline:none;
  }
  video.live-video::-webkit-media-controls,
  video.live-video::-webkit-media-controls-enclosure,
  video.live-video::-webkit-media-controls-panel,
  video.live-video::-webkit-media-controls-play-button,
  video.live-video::-webkit-media-controls-start-playback-button,
  video.live-video::-webkit-media-controls-timeline,
  video.live-video::-webkit-media-controls-current-time-display,
  video.live-video::-webkit-media-controls-time-remaining-display,
  video.live-video::-webkit-media-controls-mute-button,
  video.live-video::-webkit-media-controls-volume-slider,
  video.live-video::-webkit-media-controls-fullscreen-button,
  video.live-video::-webkit-media-controls-toggle-closed-captions-button,
  video.live-video::-webkit-media-controls-overlay-play-button{
    display:none !important;
    -webkit-appearance:none !important;
    opacity:0 !important;
    pointer-events:none !important;
  }
  iframe.live-iframe{
    width:100%; height:100%;
    border:0; background:#000;
    pointer-events:none;
  }
  .gesture-shield{
    position:absolute; inset:0;
    z-index:5;
    background:transparent;
    touch-action:none;
  }
  #now-playing{
    position:absolute;
    top:calc(14px + env(safe-area-inset-top, 0px));
    left:calc(14px + env(safe-area-inset-left, 0px));
    z-index:20;
    max-width:min(70%, 420px);
    display:flex; align-items:center; gap:8px;
    background:rgba(10,10,12,0.4);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    color:#fff;
    font-size:13px;
    font-weight:600;
    letter-spacing:.01em;
    padding:8px 12px;
    border-radius:8px;
    pointer-events:none;
    opacity:1;
    transition:opacity .3s ease;
  }
  #now-playing .np-dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--live-dot);
    flex-shrink:0;
    animation:pulse 1.4s ease-in-out infinite;
  }
  #now-playing .np-title{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:opacity .25s ease;
  }
  #now-playing.empty{ display:none; }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.4; transform:scale(.75); }
  }
  #buffer-spinner{
    position:absolute; top:50%; left:50%;
    width:46px; height:46px;
    margin:-23px 0 0 -23px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,0.18);
    border-top-color:#fff;
    z-index:15;
    display:none;
    animation:spin .8s linear infinite;
    pointer-events:none;
  }
  #buffer-spinner.show{ display:block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #controls-bar{
    position:absolute;
    left:0; right:0;
    bottom:0;
    z-index:20;
    display:flex; align-items:center; gap:14px;
    padding:12px 16px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    padding-left:calc(16px + env(safe-area-inset-left, 0px));
    padding-right:calc(16px + env(safe-area-inset-right, 0px));
    background:linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0));
    opacity:0;
    transform:translateY(12px);
    transition:opacity .3s ease, transform .3s ease;
    pointer-events:none;
    box-sizing:border-box;
  }
  #player-container.show-ui #controls-bar{
    opacity:1; transform:translateY(0);
    pointer-events:auto;
  }
  .ctrl-btn{
    width:42px; height:42px;
    border-radius:50%;
    border:none;
    background:var(--control-bg);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s ease, transform .1s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .ctrl-btn:hover{ background:var(--control-bg-hover); }
  .ctrl-btn:active{ transform:scale(.92); }
  .ctrl-btn svg{ width:20px; height:20px; fill:var(--icon); }
  #spacer{ flex:1; }
  #fullscreen-btn{ margin-left:auto; }
  #unlock-overlay{
    position:absolute; inset:0;
    z-index:30;
    background:rgba(0,0,0,0.55);
    display:none;
    align-items:center; justify-content:center;
    flex-direction:column;
    gap:14px;
    color:#fff;
    text-align:center;
    cursor:pointer;
  }
  #unlock-overlay.show{ display:flex; }
  #unlock-overlay .unlock-icon{
    width:74px; height:74px;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    display:flex; align-items:center; justify-content:center;
    border:2px solid rgba(255,255,255,0.3);
  }
  #unlock-overlay .unlock-icon svg{ width:30px; height:30px; fill:#fff; margin-left:4px; }
  #unlock-overlay span{ font-size:14px; opacity:.85; letter-spacing:.02em; }
  #error-state{
    position:absolute; inset:0;
    z-index:25;
    display:none;
    align-items:center; justify-content:center;
    color:rgba(255,255,255,0.6);
    font-size:13px;
    background:#000;
  }
  #error-state.show{ display:flex; }
</style>
</head>
<body>

<div id="player-container">
  <div id="media-stage"></div>

  <div id="buffer-spinner"></div>
  <div id="error-state">Reconnecting to live signal…</div>

  <div id="now-playing" class="empty">
    <span class="np-dot"></span>
    <span class="np-title" id="np-title"></span>
  </div>

  <div id="unlock-overlay">
    <div class="unlock-icon">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <span>Tap to join live</span>
  </div>

  <div id="controls-bar">
    <button class="ctrl-btn" id="play-btn" aria-label="Play/Pause">
      <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pause-icon" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <button class="ctrl-btn" id="mute-btn" aria-label="Mute/Unmute">
      <svg id="unmute-icon" viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12z"/></svg>
      <svg id="mute-icon" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.62l2.45 2.45c.03-.24.05-.5.05-.71v3.67zM3 10v4h4l5 5V5L7 10H3zm14.73 4.73L19.27 16 21 14.27 19.27 12.55 21 10.82 19.27 9.09 17.55 10.82 15.82 9.09 14.09 10.82l1.73 1.73-1.73 1.73L15.82 16z"/></svg>
    </button>
    <div id="spacer"></div>
    <button class="ctrl-btn" id="fullscreen-btn" aria-label="Fullscreen">
      <svg id="fs-enter-icon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      <svg id="fs-exit-icon" viewBox="0 0 24 24" style="display:none"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
    </button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var CONFIG = {
    PLAYLIST_URL: "playlist.json",
    POLL_INTERVAL_MS: 2000,
    DRIFT_TOLERANCE_SEC: 3.0, // Increased tolerance for live stability
    DRIFT_CHECK_MS: 1000,
    DEFAULT_DURATION_SEC: 60,
    schedule_start: null
  };

  var state = {
    playlist: [],
    playlistRaw: "",
    totalDuration: 0,
    cumulative: [],
    currentIndex: -1,
    currentEl: null,
    muted: true,
    userGestureUnlocked: false,
    fetchInFlight: false,
    driftTimer: null,
    pollTimer: null,
    uiHideTimer: null,
    itemAdvanceTimer: null,
    lastGoodFetchAt: 0
  };

  var stage = document.getElementById("media-stage");
  var container = document.getElementById("player-container");
  var spinner = document.getElementById("buffer-spinner");
  var errorState = document.getElementById("error-state");
  var unlockOverlay = document.getElementById("unlock-overlay");
  var nowPlayingBox = document.getElementById("now-playing");
  var nowPlayingTitle = document.getElementById("np-title");
  var lastNowPlayingText = "";

  function deriveTitle(item){
    if (!item) return "";
    if (item.title) return String(item.title);
    if (item.name) return String(item.name);
    try {
      var clean = item.url.split("?")[0].split("#")[0];
      var last = clean.substring(clean.lastIndexOf("/") + 1);
      last = decodeURIComponent(last).replace(/\.[a-zA-Z0-9]+$/, "").replace(/[-_]+/g, " ").trim();
      return last || "Now streaming";
    } catch(e){
      return "Now streaming";
    }
  }

  function updateNowPlaying(item){
    var text = deriveTitle(item);
    if (text === lastNowPlayingText) return;
    lastNowPlayingText = text;
    nowPlayingBox.classList.toggle("empty", !text);
    nowPlayingTitle.style.opacity = "0";
    setTimeout(function(){
      nowPlayingTitle.textContent = text;
      nowPlayingTitle.style.opacity = "1";
    }, 120);
  }

  function nowMs(){ return Date.now(); }

  function safeNumber(n, fallback){
    var v = Number(n);
    return (isFinite(v) && v > 0) ? v : fallback;
  }

  function parseScheduleStart(startVal){
    if (!startVal && state.playlist.length && state.playlist[0].schedule_start) {
      startVal = state.playlist[0].schedule_start;
    }
    if (!startVal) return 0;
    if (typeof startVal === "number") {
      return startVal < 10000000000 ? startVal * 1000 : startVal;
    }
    var parsed = new Date(startVal).getTime();
    return isNaN(parsed) ? 0 : parsed;
  }

  function buildSchedule(list){
    var cumulative = [];
    var total = 0;
    for (var i = 0; i < list.length; i++){
      var d = safeNumber(list[i].duration_seconds, CONFIG.DEFAULT_DURATION_SEC);
      cumulative.push(total);
      total += d;
    }
    return { cumulative: cumulative, total: total };
  }

  function computeLivePosition(){
    if (!state.playlist.length || state.totalDuration <= 0) return null;
    
    var anchorMs = parseScheduleStart(CONFIG.schedule_start);
    var elapsedMs = nowMs() - anchorMs;
    var totalDurationMs = state.totalDuration * 1000;

    if (elapsedMs < 0) {
      elapsedMs = (elapsedMs % totalDurationMs) + totalDurationMs;
    }

    var posInLoop = (elapsedMs / 1000) % state.totalDuration;

    var lo = 0, hi = state.cumulative.length - 1, idx = 0;
    while (lo <= hi){
      var mid = (lo + hi) >> 1;
      if (state.cumulative[mid] <= posInLoop){ idx = mid; lo = mid + 1; }
      else { hi = mid - 1; }
    }
    var offsetIntoItem = posInLoop - state.cumulative[idx];
    return { index: idx, offset: offsetIntoItem };
  }

  function fetchPlaylist(){
    if (state.fetchInFlight) return;
    state.fetchInFlight = true;

    var url = CONFIG.PLAYLIST_URL + (CONFIG.PLAYLIST_URL.indexOf("?") === -1 ? "?" : "&") + "t=" + nowMs();

    fetch(url, { cache: "no-store" })
      .then(function(res){
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function(text){
        state.fetchInFlight = false;
        state.lastGoodFetchAt = nowMs();
        hideErrorState();
        if (text === state.playlistRaw) return;
        var parsed;
        try { parsed = JSON.parse(text); }
        catch(e){ console.warn("Invalid playlist JSON:", e); return; }
        if (!Array.isArray(parsed) || parsed.length === 0) return;
        applyPlaylistUpdate(parsed, text);
      })
      .catch(function(err){
        state.fetchInFlight = false;
        if (nowMs() - state.lastGoodFetchAt > 15000 && state.lastGoodFetchAt !== 0){
          showErrorState();
        }
      });
  }

  function applyPlaylistUpdate(newList, rawText){
    var sched = buildSchedule(newList);
    state.playlist = newList;
    state.playlistRaw = rawText;
    state.cumulative = sched.cumulative;
    state.totalDuration = sched.total;
    scheduleNextBoundaryCheck();

    var pos = computeLivePosition();
    if (pos && pos.index === state.currentIndex && state.playlist[pos.index]){
      updateNowPlaying(state.playlist[pos.index]);
    }
  }

  function showErrorState(){ errorState.classList.add("show"); }
  function hideErrorState(){ errorState.classList.remove("show"); }

  function clearStage(){
    while (stage.firstChild) stage.removeChild(stage.firstChild);
  }

  function createVideoLayer(item, startOffset){
    var layer = document.createElement("div");
    layer.className = "media-layer";

    var video = document.createElement("video");
    video.className = "live-video";
    video.autoplay = true;
    video.playsInline = true;
    video.setAttribute("webkit-playsinline", "true");
    video.setAttribute("playsinline", "true");
    video.muted = state.muted;
    video.controls = false;
    video.disablePictureInPicture = true;
    video.setAttribute("controlsList", "nodownload noremoteplayback noplaybackrate nofullscreen");
    video.setAttribute("oncontextmenu", "return false;");
    video.preload = "auto";

    var isHlsStream = (item.type === "hls" || item.type === "m3u8" || item.url.indexOf(".m3u8") !== -1);

    if (isHlsStream && window.Hls && window.Hls.isSupported()){
      var hls = new Hls({ 
        liveSyncDurationCount: 3,
        liveMaxLatencyDurationCount: 10,
        maxBufferLength: 30,
        maxMaxBufferLength: 60
      });
      hls.loadSource(item.url);
      hls.attachMedia(video);
      layer._hls = hls;
      layer._isHls = true;
    } else {
      video.src = item.url;
      layer._isHls = false;
    }

    layer.appendChild(video);

    var shield = document.createElement("div");
    shield.className = "gesture-shield";
    layer.appendChild(shield);

    layer._video = video;
    layer._startOffset = startOffset;
    layer._contextmenuBlock = function(e){ e.preventDefault(); };
    layer.addEventListener("contextmenu", layer._contextmenuBlock);

    video.addEventListener("waiting", function(){ spinner.classList.add("show"); });
    video.addEventListener("playing", function(){ spinner.classList.remove("show"); });
    video.addEventListener("canplay", function(){ spinner.classList.remove("show"); });

    return layer;
  }

  function createIframeLayer(item){
    var layer = document.createElement("div");
    layer.className = "media-layer";
    var iframe = document.createElement("iframe");
    iframe.className = "live-iframe";
    iframe.src = item.url;
    iframe.setAttribute("allow", "autoplay; encrypted-media; picture-in-picture");
    iframe.setAttribute("allowfullscreen", "true");
    iframe.setAttribute("referrerpolicy", "no-referrer-when-downgrade");
    iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation");
    layer.appendChild(iframe);

    var shield = document.createElement("div");
    shield.className = "gesture-shield";
    layer.appendChild(shield);

    layer._iframe = iframe;
    return layer;
  }

  function renderCurrentItem(){
    var pos = computeLivePosition();
    if (!pos) return;
    var item = state.playlist[pos.index];
    if (!item || !item.url) return;

    if (pos.index === state.currentIndex && state.currentEl) {
      return;
    }

    clearItemAdvanceTimer();

    var oldEl = state.currentEl;
    var newEl;

    var isHlsType = (item.type === "hls" || item.type === "m3u8" || item.url.indexOf(".m3u8") !== -1);
    if (isHlsType || item.type === "mp4"){
      newEl = createVideoLayer(item, pos.offset);
    } else if (item.type === "iframe"){
      newEl = createIframeLayer(item);
    } else {
      console.warn("Unknown item type:", item.type);
      state.currentIndex = pos.index;
      scheduleNextBoundaryCheck();
      return;
    }

    stage.appendChild(newEl);
    requestAnimationFrame(function(){ newEl.classList.add("active"); });

    if (newEl._video){
      var v = newEl._video;
      var trySeek = function(){
        // Skip manual seeking overrides for live HLS to let hls.js handle synchronization natively
        if (!newEl._isHls && v.readyState >= 1 && isFinite(pos.offset)){
          try { v.currentTime = pos.offset; } catch(e){}
        }
        var p = v.play();
        if (p && p.catch) p.catch(function(){ showUnlockOverlay(); });
      };
      if (v.readyState >= 1) trySeek();
      else v.addEventListener("loadedmetadata", trySeek, { once:true });
    }

    state.currentIndex = pos.index;
    state.currentEl = newEl;
    updateNowPlaying(item);

    if (oldEl){
      setTimeout(function(){
        if (oldEl._hls) { try{ oldEl._hls.destroy(); }catch(e){} }
        if (oldEl.parentNode) oldEl.parentNode.removeChild(oldEl);
      }, 400);
    }

    scheduleNextBoundaryCheck();
  }

  function clearItemAdvanceTimer(){
    if (state.itemAdvanceTimer){
      clearTimeout(state.itemAdvanceTimer);
      state.itemAdvanceTimer = null;
    }
  }

  function scheduleNextBoundaryCheck(){
    clearItemAdvanceTimer();
    if (!state.playlist.length) return;
    var pos = computeLivePosition();
    if (!pos) return;
    var duration = safeNumber(state.playlist[pos.index].duration_seconds, CONFIG.DEFAULT_DURATION_SEC);
    var remaining = Math.max(0.05, duration - pos.offset);
    state.itemAdvanceTimer = setTimeout(renderCurrentItem, remaining * 1000 + 30);
  }

  function driftCorrectionLoop(){
    var pos = computeLivePosition();
    if (pos && pos.index !== state.currentIndex){
      renderCurrentItem();
      return;
    }
    // Skip manual drift forcing entirely if current media element is an HLS live stream
    if (!pos || !state.currentEl || !state.currentEl._video || state.currentEl._isHls) return;
    
    var video = state.currentEl._video;
    if (video.readyState < 1) return;

    var expected = pos.offset;
    var actual = video.currentTime;
    var drift = actual - expected;

    if (Math.abs(drift) > CONFIG.DRIFT_TOLERANCE_SEC){
      try {
        video.currentTime = expected;
      } catch(e){}
    }
  }

  function showUnlockOverlay(){
    unlockOverlay.classList.add("show");
  }
  function hideUnlockOverlay(){
    unlockOverlay.classList.remove("show");
  }
  unlockOverlay.addEventListener("click", function(){
    state.userGestureUnlocked = true;
    if (state.currentEl && state.currentEl._video){
      var v = state.currentEl._video;
      v.muted = state.muted;
      v.play().catch(function(){});
    }
    hideUnlockOverlay();
  });

  var playBtn = document.getElementById("play-btn");
  var playIcon = document.getElementById("play-icon");
  var pauseIcon = document.getElementById("pause-icon");
  var muteBtn = document.getElementById("mute-btn");
  var muteIcon = document.getElementById("mute-icon");
  var unmuteIcon = document.getElementById("unmute-icon");
  var fsBtn = document.getElementById("fullscreen-btn");
  var fsEnterIcon = document.getElementById("fs-enter-icon");
  var fsExitIcon = document.getElementById("fs-exit-icon");

  function updatePlayIcon(){
    var playing = state.currentEl && state.currentEl._video && !state.currentEl._video.paused;
    playIcon.style.display = playing ? "none" : "block";
    pauseIcon.style.display = playing ? "block" : "none";
  }

  playBtn.addEventListener("click", function(){
    if (!state.currentEl || !state.currentEl._video) return;
    var v = state.currentEl._video;
    if (v.paused){
      var pos = computeLivePosition();
      if (pos && pos.index === state.currentIndex && !state.currentEl._isHls){
        try { v.currentTime = pos.offset; } catch(e){}
      }
      v.play().catch(showUnlockOverlay);
    } else {
      v.pause();
    }
    updatePlayIcon();
  });

  function updateMuteIcon(){
    muteIcon.style.display = state.muted ? "block" : "none";
    unmuteIcon.style.display = state.muted ? "none" : "block";
  }

  muteBtn.addEventListener("click", function(){
    state.muted = !state.muted;
    if (state.currentEl && state.currentEl._video){
      state.currentEl._video.muted = state.muted;
      if (!state.muted) state.currentEl._video.play().catch(showUnlockOverlay);
    }
    updateMuteIcon();
  });

  function isFullscreen(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function updateFsIcon(){
    fsEnterIcon.style.display = isFullscreen() ? "none" : "block";
    fsExitIcon.style.display = isFullscreen() ? "block" : "none";
  }
  fsBtn.addEventListener("click", function(){
    if (isFullscreen()){
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } else {
      var el = container;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }
  });
  document.addEventListener("fullscreenchange", updateFsIcon);
  document.addEventListener("webkitfullscreenchange", updateFsIcon);

  function showUI(){
    container.classList.add("show-ui");
    clearTimeout(state.uiHideTimer);
    state.uiHideTimer = setTimeout(function(){
      container.classList.remove("show-ui");
    }, 3000);
  }
  container.addEventListener("mousemove", showUI);
  container.addEventListener("click", showUI);
  container.addEventListener("touchstart", showUI, { passive: true });
  showUI();

  setInterval(function(){
    updatePlayIcon();
  }, 500);

  document.addEventListener("keydown", function(e){
    var blocked = ["ArrowLeft","ArrowRight","MediaTrackPrevious","MediaTrackNext","MediaRewind","MediaFastForward"];
    if (blocked.indexOf(e.key) !== -1){
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);

  container.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  var lastTouchEnd = 0;
  container.addEventListener("touchend", function(e){
    var now = nowMs();
    if (now - lastTouchEnd <= 300){ e.preventDefault(); }
    lastTouchEnd = now;
  }, { passive:false });

  stage.addEventListener("seeked", function(e){
    var v = e.target;
    if (!v || v.tagName !== "VIDEO" || (state.currentEl && state.currentEl._isHls)) return;
    var pos = computeLivePosition();
    if (!pos || pos.index !== state.currentIndex) return;
    var drift = Math.abs(v.currentTime - pos.offset);
    if (drift > CONFIG.DRIFT_TOLERANCE_SEC){
      try { v.currentTime = pos.offset; } catch(err){}
    }
  }, true);

  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible"){
      renderCurrentItem();
      driftCorrectionLoop();
      fetchPlaylist();
    }
  });

  function boot(){
    updateMuteIcon();
    updatePlayIcon();
    updateFsIcon();

    fetchPlaylist();
    state.pollTimer = setInterval(fetchPlaylist, CONFIG.POLL_INTERVAL_MS);

    var waitForPlaylist = setInterval(function(){
      if (state.playlist.length){
        clearInterval(waitForPlaylist);
        renderCurrentItem();
        state.driftTimer = setInterval(driftCorrectionLoop, CONFIG.DRIFT_CHECK_MS);
      }
    }, 100);
  }

  (function loadHlsJs(){
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js";
    s.onload = boot;
    s.onerror = boot;
    document.head.appendChild(s);
  })();

})();
</script>
</body>
</html>
